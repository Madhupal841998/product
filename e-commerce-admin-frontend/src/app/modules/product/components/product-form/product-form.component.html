<div class="container mt-4">
  <div class="card">
    <div class="card-header">
      <h2>{{ isEditMode ? 'Edit' : 'Create' }} Product</h2>
    </div>
    <div class="card-body">
      <div *ngIf="error" class="alert alert-danger">
        {{ error }}
      </div>
      
      <div *ngIf="loading" class="text-center">
        <div class="spinner-border" role="status">
          <span class="sr-only">Loading...</span>
        </div>
      </div>
      
      <form [formGroup]="productForm" (ngSubmit)="onSubmit()" *ngIf="!loading" enctype="multipart/form-data">
        <div class="form-group">
          <label for="sku">SKU*</label>
          <input 
            type="text" 
            class="form-control" 
            id="sku" 
            formControlName="sku" 
            [ngClass]="{'is-invalid': productForm.get('sku')?.invalid && productForm.get('sku')?.touched}"
          >
          <div class="invalid-feedback" *ngIf="productForm.get('sku')?.errors?.required && productForm.get('sku')?.touched">
            SKU is required.
          </div>
          <div class="invalid-feedback" *ngIf="productForm.get('sku')?.errors?.maxlength && productForm.get('sku')?.touched">
            SKU cannot exceed 50 characters.
          </div>
        </div>
        
        <div class="form-group">
          <label for="name">Product Name*</label>
          <input 
            type="text" 
            class="form-control" 
            id="name" 
            formControlName="name"
            [ngClass]="{'is-invalid': productForm.get('name')?.invalid && productForm.get('name')?.touched}"
          >
          <div class="invalid-feedback" *ngIf="productForm.get('name')?.errors?.required && productForm.get('name')?.touched">
            Product name is required.
          </div>
          <div class="invalid-feedback" *ngIf="productForm.get('name')?.errors?.maxlength && productForm.get('name')?.touched">
            Product name cannot exceed 100 characters.
          </div>
        </div>
        
        <div class="form-group">
          <label for="price">Price*</label>
          <div class="input-group">
            <div class="input-group-prepend">
              <span class="input-group-text">₹</span>
            </div>
            <input 
              type="number" 
              class="form-control" 
              id="price" 
              formControlName="price"
              step="0.01"
              min="0"
              [ngClass]="{'is-invalid': productForm.get('price')?.invalid && productForm.get('price')?.touched}"
            >
          </div>
          <div class="invalid-feedback d-block" *ngIf="productForm.get('price')?.errors?.required && productForm.get('price')?.touched">
            Price is required.
          </div>
          <div class="invalid-feedback d-block" *ngIf="productForm.get('price')?.errors?.min && productForm.get('price')?.touched">
            Price cannot be negative.
          </div>
        </div>
        
        <div class="form-group">
          <label for="description">Description</label>
          <textarea 
            class="form-control" 
            id="description" 
            formControlName="description"
            rows="4"
          ></textarea>
        </div>
        
        <div class="form-group">
          <label>Product Images</label>
          
          <div formArrayName="images">
            <div class="mb-2" *ngFor="let imageControl of imagesFormArray.controls; let i = index">
              <div class="input-group">
                <input 
                  type="file" 
                  class="form-control" 
                  [formControlName]="i"
                  (change)="onFileChange($event, i)"
                  accept="image/*"
                >
                <div class="input-group-append">
                  <button 
                    type="button" 
                    class="btn btn-danger" 
                    (click)="removeImageField(i)"
                  >
                    <i class="fa fa-trash"></i>
                  </button>
                </div>
              </div>
              <div *ngIf="imagePreviews[i]" class="mt-2">
                <img [src]="imagePreviews[i]" class="img-thumbnail" style="max-height: 100px;">
              </div>
            </div>
          </div>
          
          <button 
            type="button" 
            class="btn btn-outline-secondary mt-2" 
            (click)="addImageField()"
          >
            <i class="fa fa-plus"></i> Add Image
          </button>
        </div>
        
        <div class="form-group">
          <div class="custom-control custom-switch">
            <input 
              type="checkbox" 
              class="custom-control-input" 
              id="isactive" 
              formControlName="isactive"
            >
            <label class="custom-control-label" for="isactive">Active</label>
          </div>
        </div>
        
        <div class="form-group mt-4">
          <button 
            type="submit" 
            class="btn btn-primary" 
            [disabled]="submitting || productForm.invalid"
          >
            <span *ngIf="submitting" class="spinner-border spinner-border-sm mr-1" role="status" aria-hidden="true"></span>
            {{ isEditMode ? 'Update' : 'Create' }} Product
          </button>
          <a routerLink="/products" class="btn btn-secondary ml-2">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
